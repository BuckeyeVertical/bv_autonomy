[project]
name = "bv_autonomy"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy"]

[project.optional-dependencies]
# Not a hard dependency: the Jetson uses its system OpenCV, built with GStreamer.
opencv = ["opencv-python"]
ltdetr = ["lightly-train"]
localizer = ["geographiclib", "scipy"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
