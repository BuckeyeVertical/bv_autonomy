[project]
name = "bv_autonomy"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]
# Not a hard dependency: the Jetson uses its system OpenCV, built with GStreamer.
opencv = ["opencv-python"]
ltdetr = ["lightly-train"]
localizer = ["geographiclib", "scipy"]
mavsdk = ["mavsdk>=4"]
stitcher = ["piexif"]
gcs = ["aiohttp", "av>=14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -p no:cacheprovider"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
